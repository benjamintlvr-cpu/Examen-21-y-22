<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluación de Informática</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 16px;
    }
    .logo-container img {
      max-width: 140px;
      height: auto;
      border-radius: 12px;
      object-fit: contain;
    }
    h1 {
      margin: 0 0 8px 0;
      color: #0f172a;
      font-size: 26px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      margin: 0 0 22px 0;
      font-size: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: #334155;
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #f8fafc;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      background: #ffffff;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid #e2e8f0;
      font-weight: 700;
      color: #334155;
    }
    .timer {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid #fde68a;
    }
    .timer.danger {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
      animation: pulse 0.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #2563eb;
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-text {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      line-height: 1.45;
      color: #0f172a;
    }
    .question-img-wrap {
      margin-bottom: 16px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .question-img-wrap img {
      max-width: 100%;
      max-height: 180px;
      width: auto;
      height: auto;
      border-radius: 8px;
      object-fit: contain;
      display: block;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      text-align: left;
      padding: 13px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      cursor: pointer;
      font-size: 15px;
      color: #1e293b;
      transition: all 0.15s ease;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .option-btn.selected {
      border-color: #2563eb;
      background: #dbeafe;
      font-weight: 700;
      color: #1e3a8a;
    }
    .option-btn:disabled {
      cursor: default;
      opacity: 0.85;
    }
    .status-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }
    .status-msg.recorded {
      display: block;
      background: #f1f5f9;
      color: #334155;
      border-left: 4px solid #2563eb;
    }
    .status-msg.timeout {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border-left: 4px solid #dc2626;
    }
    .footer-actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 13px 26px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover:not(:disabled) {
      background: #1d4ed8;
    }
    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }
    .result-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #eff6ff;
      border: 6px solid #2563eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 14px auto;
    }
    .score-number {
      font-size: 32px;
      font-weight: 800;
      color: #1e3a8a;
      line-height: 1;
    }
    .score-label {
      font-size: 13px;
      color: #475569;
      font-weight: 600;
      margin-top: 4px;
    }
    .summary-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 15px;
    }
    .summary-row:last-child { border-bottom: none; }
    .save-status {
      margin-top: 16px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- PANTALLA 2: CUESTIONARIO (30 PREGUNTAS) -->
    <div id="quizScreen" class="hidden">
      <div class="top-bar">
        <span id="progressText">Pregunta 1 de 30</span>
        <span class="timer" id="timerBox">01:00</span>
      </div>
      <div class="progress-bar-bg">

      </div>

      </div>
      <div class="options" id="optionsContainer"></div>
      <div class="status-msg" id="statusMsg"></div>

      <div class="footer-actions">
        <button type="button" class="btn-primary" id="btnNext" disabled>Siguiente</button>
      </div>
    </div>

    <!-- PANTALLA 3: RESULTADOS FINALES -->
    <div id="resultScreen" class="hidden">
      <div class="result-header">
        <div class="score-circle">
          <span class="score-number" id="finalScore">0</span>
          <span class="score-label">de 100 pts</span>
        </div>
        <h1>Evaluación Completada</h1>
      </div>

      <div class="summary-box" id="studentSummary"></div>
      <p class="save-status" id="saveStatus">Enviando resultados...</p>
    </div>
  </div>

  <script>

    // =========================================================================
    // MOTOR DE SONIDOS (RELOJ TIC-TAC + RESPUESTA CORRECTA / INCORRECTA)
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.tickToggle = false;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      playTick(isUrgent = false) {
        try {
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = "triangle";
          this.tickToggle = !this.tickToggle;
          const baseFreq = this.tickToggle ? 950 : 750;
          osc.frequency.setValueAtTime(isUrgent ? baseFreq + 250 : baseFreq, now);

          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.05);
        } catch (e) {}
      }

      playCorrect() {
        try {
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880.00, now + 0.11);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.33);
        } catch (e) {}
      }

      playIncorrect() {
        try {
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.25);

          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.3);
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    // =========================================================================
    // VARIABLES DE ESTADO Y LÓGICA DEL CUESTIONARIO
    // =========================================================================
    let studentData = null;
    let currentIndex = 0;
    let selectedOption = null;
    let timeLeft = TIEMPO_PREGUNTA;
    let timerInterval = null;
    let correctCount = 0;
    let incorrectCount = 0;
    let answersLog = [];

    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");

    const btnStart = document.getElementById("btnStart");
    const btnNext = document.getElementById("btnNext");

    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const timerBox = document.getElementById("timerBox");
    const questionText = document.getElementById("questionText");
    const questionImgWrap = document.getElementById("questionImgWrap");
    const questionImage = document.getElementById("questionImage");
    const optionsContainer = document.getElementById("optionsContainer");
    const statusMsg = document.getElementById("statusMsg");

    btnStart.addEventListener("click", () => {
      const nombre = document.getElementById("nombre").value.trim();
      const apellido = document.getElementById("apellido").value.trim();
      const carrera = document.getElementById("carrera").value;
      const sede = document.getElementById("sede").value;
      const sexo = document.getElementById("sexo").value;

      if (!nombre || !apellido || !carrera || !sede || !sexo) {
        alert("Por favor completa todos los campos obligatorios (Nombre, Apellido, Carrera, Sede y Sexo) antes de iniciar.");
        return;
      }

      sound.ensureContext();
      studentData = { nombre, apellido, carrera, sede, sexo };

      currentIndex = 0;
      correctCount = 0;
      incorrectCount = 0;
      answersLog = [];

      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      loadQuestion();
    });

    function loadQuestion() {
      clearInterval(timerInterval);
      selectedOption = null;
      timeLeft = TIEMPO_PREGUNTA;

      btnNext.disabled = true;
      btnNext.textContent = currentIndex === questions.length - 1 ? "Finalizar Evaluación" : "Siguiente";

      statusMsg.className = "status-msg";
      statusMsg.textContent = "";

      const item = questions[currentIndex];
      progressText.textContent = `Pregunta ${currentIndex + 1} de ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = item.q;

      if (item.img) {
        questionImage.src = item.img;
        questionImage.alt = `Imagen de referencia para: ${item.q}`;
        questionImgWrap.classList.remove("hidden");
      } else {
        questionImgWrap.classList.add("hidden");
      }

      optionsContainer.innerHTML = "";

      item.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.addEventListener("click", () => selectOption(idx, btn));
        optionsContainer.appendChild(btn);
      });

      updateTimerDisplay();
      sound.playTick(false);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft > 0) {
          sound.playTick(timeLeft <= 10);
        } else {
          clearInterval(timerInterval);
          handleTimeExpired();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(timeLeft / 60)).padStart(2, "0");
      const secs = String(timeLeft % 60).padStart(2, "0");
      timerBox.textContent = `${mins}:${secs}`;

      if (timeLeft <= 10) {
        timerBox.classList.add("danger");
      } else {
        timerBox.classList.remove("danger");
      }
    }

    function selectOption(idx, clickedBtn) {
      if (selectedOption !== null || timeLeft <= 0) return;

      clearInterval(timerInterval);
      selectedOption = idx;

      const allBtns = optionsContainer.querySelectorAll(".option-btn");
      allBtns.forEach(b => (b.disabled = true));
      clickedBtn.classList.add("selected");

      const item = questions[currentIndex];
      const isCorrect = idx === item.answer;

      if (isCorrect) {
        correctCount++;
        sound.playCorrect();
      } else {
        incorrectCount++;
        sound.playIncorrect();
      }

      statusMsg.className = "status-msg recorded";
      statusMsg.textContent = "Respuesta registrada. Haz clic en Siguiente para continuar.";

      answersLog.push({
        numero: currentIndex + 1,
        pregunta: item.q,
        respuestaUsuario: item.options[idx],
        esCorrecta: isCorrect
      });

      btnNext.disabled = false;
    }

    function handleTimeExpired() {
      if (selectedOption !== null) return;
      selectedOption = -1;
      incorrectCount++;

      const allBtns = optionsContainer.querySelectorAll(".option-btn");
      allBtns.forEach(b => (b.disabled = true));

      sound.playIncorrect();

      statusMsg.className = "status-msg timeout";
      statusMsg.textContent = "Tiempo agotado para esta pregunta. Haz clic en Siguiente para continuar.";

      const item = questions[currentIndex];
      answersLog.push({
        numero: currentIndex + 1,
        pregunta: item.q,
        respuestaUsuario: "Sin responder (Tiempo agotado)",
        esCorrecta: false
      });

      btnNext.disabled = false;
    }

    btnNext.addEventListener("click", () => {
      if (selectedOption === null) return;

      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        finishEvaluation();
      }
    });

    async function finishEvaluation() {
      clearInterval(timerInterval);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const finalScore = Math.round((correctCount / questions.length) * 100);
      document.getElementById("finalScore").textContent = finalScore;

      document.getElementById("studentSummary").innerHTML = `
        <div class="summary-row"><span><strong>Estudiante:</strong></span><span>${studentData.nombre} ${studentData.apellido}</span></div>
        <div class="summary-row"><span><strong>Carrera:</strong></span><span>${studentData.carrera}</span></div>
        <div class="summary-row"><span><strong>Sede / Sexo:</strong></span><span>${studentData.sede} / ${studentData.sexo}</span></div>
        <div class="summary-row"><span><strong>Respuestas Correctas:</strong></span><span style="color:#166534; font-weight:700;">${correctCount}</span></div>
        <div class="summary-row"><span><strong>Respuestas Incorrectas:</strong></span><span style="color:#991b1b; font-weight:700;">${incorrectCount}</span></div>
        <div class="summary-row"><span><strong>Calificación Final:</strong></span><span style="color:#1e3a8a; font-weight:800;">${finalScore} / 100</span></div>
      `;

      const saveStatus = document.getElementById("saveStatus");

      const payload = {
        student: studentData,
        correctCount: correctCount,
        incorrectCount: incorrectCount,
        score: finalScore,
        respuestas: answersLog
      };

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "PEGA_AQUI_TU_URL_DE_APP_WEB") {
        saveStatus.textContent = "Evaluación finalizada. (Configura APPS_SCRIPT_URL para guardar en Google Sheets).";
        return;
      }

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        saveStatus.textContent = "Resultados guardados correctamente en la hoja de cálculo.";
      } catch (err) {
        saveStatus.textContent = "Error al enviar los resultados. Verifica tu conexión.";
      }
    }
  </script>
</body>
